name: Build Signed Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'APK build variant to compile'
        required: true
        default: 'both'
        type: choice
        options:
          - both
          - release
          - debug

jobs:
  build-android-apk:
    name: Compile & Sign CastForge Studio APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm install'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies & build web studio bundle
        run: |
          npm ci
          npm run build

      - name: Sync web bundle into Capacitor Android project
        run: |
          npx cap sync android

      - name: Ensure Gradle wrapper is executable
        working-directory: android
        run: |
          if [ ! -f "./gradlew" ]; then
            gradle wrapper --gradle-version 8.10.2
          fi
          chmod +x ./gradlew

      - name: Provision signing keystore & assemble signed APKs
        working-directory: android
        env:
          # Optional repository secrets: if omitted, ensureSigningKeystore auto-generates a valid keystore
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          BUILD_TYPE="${{ github.event.inputs.build_type || 'both' }}"
          ./gradlew ensureSigningKeystore
          if [ "$BUILD_TYPE" = "debug" ]; then
            ./gradlew assembleDebug
          elif [ "$BUILD_TYPE" = "release" ]; then
            ./gradlew assembleRelease
          else
            ./gradlew assembleDebug assembleRelease
          fi

      - name: Verify APK signatures
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name "apksigner" | sort -V | tail -n 1)
          for apk in android/app/build/outputs/apk/*/*.apk; do
            echo "Verifying signed APK: $apk"
            "$APKSIGNER" verify --verbose "$apk"
          done

      - name: Upload Signed Debug APK
        if: always() && (github.event.inputs.build_type != 'release')
        uses: actions/upload-artifact@v4
        with:
          name: CastForge-Studio-Debug-APK
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore

      - name: Upload Signed Release APK
        if: always() && (github.event.inputs.build_type != 'debug')
        uses: actions/upload-artifact@v4
        with:
          name: CastForge-Studio-Release-APK
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: ignore
