name: Build Signed Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'APK build variant to compile'
        required: true
        default: 'both'
        type: choice
        options:
          - both
          - release
          - debug

jobs:
  build-android-apk:
    name: Compile & Sign CastForge Studio APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies & build web studio bundle
        run: |
          npm install --legacy-peer-deps
          npm run build

      - name: Sync web bundle into Capacitor Android project
        run: |
          npx cap sync android

      - name: Configure gradle.properties, RootEncoder & Android SDK 36
        working-directory: android
        run: |
          # Enable AndroidX & Jetifier
          touch gradle.properties
          grep -q "android.useAndroidX" gradle.properties || echo "android.useAndroidX=true" >> gradle.properties
          grep -q "android.enableJetifier" gradle.properties || echo "android.enableJetifier=true" >> gradle.properties
          grep -q "org.gradle.jvmargs" gradle.properties || echo "org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8" >> gradle.properties

          # Fix non-existent RootEncoder 2.5.6 version to valid 2.5.5 release
          find . -name "*.gradle*" -type f -exec sed -i 's/RootEncoder:library:2.5.6/RootEncoder:library:2.5.5/g' {} +

          # Upgrade compileSdk to 36 across variables.gradle and build.gradle files
          find . -name "*.gradle*" -type f -exec sed -i 's/compileSdkVersion = [0-9]*/compileSdkVersion = 36/g' {} +
          find . -name "*.gradle*" -type f -exec sed -i 's/compileSdk = [0-9]*/compileSdk = 36/g' {} +
          find . -name "*.gradle*" -type f -exec sed -i 's/compileSdk [0-9]*/compileSdk 36/g' {} +

      - name: Ensure Gradle wrapper is executable
        working-directory: android
        run: |
          if [ ! -f "./gradlew" ]; then
            gradle wrapper --gradle-version 8.10.2
          fi
          chmod +x ./gradlew

      - name: Provision signing keystore & assemble signed APKs
        working-directory: android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          BUILD_TYPE="${{ github.event.inputs.build_type || 'both' }}"
          ./gradlew ensureSigningKeystore
          if [ "$BUILD_TYPE" = "debug" ]; then
            ./gradlew assembleDebug --stacktrace
          elif [ "$BUILD_TYPE" = "release" ]; then
            ./gradlew assembleRelease --stacktrace
          else
            ./gradlew assembleDebug assembleRelease --stacktrace
          fi

      - name: Verify APK signatures
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name "apksigner" | sort -V | tail -n 1)
          for apk in android/app/build/outputs/apk/*/*.apk; do
            echo "Verifying signed APK: $apk"
            "$APKSIGNER" verify --verbose "$apk"
          done

      - name: Upload Signed Debug APK
        if: always() && (github.event.inputs.build_type != 'release')
        uses: actions/upload-artifact@v4
        with:
          name: CastForge-Studio-Debug-APK
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore

      - name: Upload Signed Release APK
        if: always() && (github.event.inputs.build_type != 'debug')
        uses: actions/upload-artifact@v4
        with:
          name: CastForge-Studio-Release-APK
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: ignore
